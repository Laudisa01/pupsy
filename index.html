<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💨%3C/text%3E%3C/svg%3E">

<body>
<title>Pupsy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width column, cartoon cards with ink outlines + hard offset shadows, fixed bottom tab bar with a raised record button.
   Deliberately single-theme: a bright cartoon world on both host themes, every color set explicitly. */
:root {
  --ink: #221a38;
  --paper: #fff8e1;
  --card: #ffffff;
  --sun: #ffd42e;
  --bubble: #ff619e;
  --mint: #66db78;
  --grape: #946bff;
  --tang: #ff9a3d;
  --sky: #5cbfff;
  --lilac: #ddd2ff;
  --blush: #ffd0e0;
  --mist: #f3eee8;
  --mint-soft: #d9f8de;
  --bg-top: #ffed9e;
  --bg-bottom: #ffccdd;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
  background-color: var(--bg-top);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 700;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-top); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px dashed var(--grape); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.05; }
small { font-weight: 700; opacity: .65; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#app.no-tabs { padding-bottom: 32px; }

.title-row { display: flex; align-items: center; gap: 12px; }
.title-row > div { flex: 1; min-width: 0; }
.title-row h1 { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 15px; opacity: .65; margin-top: 2px; }

/* Cartoon primitives */
.card { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 5px 5px 0 var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--display); font-weight: 600; font-size: 18px;
  background: var(--sun); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 999px;
  padding: 12px 22px; box-shadow: 0 5px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.pink { background: var(--bubble); }
.btn.mint { background: var(--mint); }
.btn.white { background: var(--card); }
.btn.blush { background: var(--blush); }
.btn.sm { font-size: 15px; padding: 7px 14px; box-shadow: 0 4px 0 var(--ink); }
.btn.block { width: 100%; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  border: 2.5px solid var(--ink); background: var(--card);
  display: grid; place-items: center; font-size: 18px; font-weight: 900;
}
.pill {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  font-size: 13px; font-weight: 800; padding: 4px 10px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--paper);
}
.pill.ex { background: var(--lilac); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.avatar {
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 24px;
  background: var(--c, var(--sun)); border: 2.5px solid var(--ink);
}
.avatar.lg { width: 104px; height: 104px; font-size: 58px; border-width: 3px; }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
.label { font-family: var(--display); font-weight: 600; font-size: 17px; }
.muted { opacity: .65; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Play button + waveform */
.play {
  width: var(--s, 52px); height: var(--s, 52px); flex: none; border-radius: 50%;
  border: 3px solid var(--ink); background: var(--sun);
  display: grid; place-items: center;
}
.play svg { width: 52%; height: 52%; fill: var(--ink); }
.play .go { margin-left: 8%; }
.play .stop { display: none; }
.play.playing { background: var(--bubble); }
.play.playing .go { display: none; }
.play.playing .stop { display: block; }
.play.loading { animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(.9); } }
.wave { position: relative; flex: 1; min-width: 0; height: var(--h, 70px); }
.wave .bars { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; }
.wave .bars i { flex: 1; min-width: 1px; border-radius: 99px; background: var(--c, var(--grape)); }
.wave .fill { clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
.wave .fill i { background: var(--bubble); }
.player { display: flex; align-items: center; gap: 12px; }

/* Challenge banner */
.challenge { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--mint); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); }
.challenge .em { font-size: 30px; }
.challenge h3 { font-size: 18px; font-weight: 600; }
.challenge p { margin: 2px 0 0; font-size: 13px; }

.notice { padding: 12px 14px; border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); background: var(--paper); font-size: 14px; }

/* Swipe deck */
.deck { position: relative; height: clamp(430px, 58vh, 540px); }
.swipe-card {
  position: absolute; inset: 0; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  border-radius: 28px; box-shadow: 6px 6px 0 var(--ink); touch-action: none; user-select: none;
  transition: transform .25s ease;
}
.swipe-card h2 { font-size: 28px; font-weight: 700; overflow-wrap: anywhere; }
.swipe-card .player { padding: 14px; border-radius: 18px; background: var(--tint, var(--mist)); }
.swipe-card .foot { margin-top: auto; display: flex; gap: 14px; font-size: 13px; opacity: .55; }
.swipe-card .foot span:last-child { margin-left: auto; }
.stamp {
  position: absolute; top: 96px; font-family: var(--display); font-weight: 700; font-size: 30px;
  padding: 4px 14px; border: 5px solid currentColor; border-radius: 12px; background: rgba(255,255,255,.9);
  opacity: 0; pointer-events: none;
}
.stamp.like { left: 22px; color: #1f9e3a; transform: rotate(-14deg); }
.stamp.nope { right: 22px; color: #d62f6f; transform: rotate(14deg); }
.stamp.super { left: 50%; transform: translateX(-50%); color: #1878c9; }
.actions { display: flex; justify-content: center; align-items: center; gap: 26px; }
.round {
  width: var(--s, 64px); height: var(--s, 64px); border-radius: 50%; border: 3px solid var(--ink);
  background: var(--c); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center;
  font-size: calc(var(--s, 64px) * .42); transition: transform .08s, box-shadow .08s;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.food-line { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.note { font-style: italic; font-size: 14px; }

/* Segmented control */
.seg { display: flex; gap: 4px; padding: 5px; border-radius: 28px; box-shadow: 3px 3px 0 var(--ink); }
.seg button {
  flex: 1; min-width: 0; border: 2.5px solid transparent; background: none; border-radius: 999px;
  padding: 9px 4px; font-family: var(--display); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--sun); border-color: var(--ink); }

/* Leaderboard */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; text-align: center; }
.pod .who { font-size: 13px; max-width: 100%; }
.pod .what { font-size: 11px; opacity: .7; max-width: 100%; }
.pod .block {
  width: 100%; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink);
  display: grid; place-content: center; text-align: center;
}
.pod .block b { font-family: var(--display); font-size: 34px; line-height: 1; }
.pod .block small { opacity: 1; font-size: 12px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; box-shadow: 3px 3px 0 var(--ink); }
.lb-row .rank { font-family: var(--display); font-size: 20px; width: 28px; text-align: center; flex: none; }
.lb-row .score { text-align: center; font-family: var(--display); font-size: 18px; line-height: 1; flex: none; font-variant-numeric: tabular-nums; }
.lb-row .score small { display: block; font-size: 10px; font-family: var(--body); }
.bar { height: 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tang); }
.bar.xp > i { background: var(--mint); }

/* Duels */
.duel-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: transform .3s, opacity .3s, background .3s; }
.duel-card.won { background: var(--mint-soft); transform: scale(1.02); }
.duel-card.lost { opacity: .45; transform: scale(.97); }
.vs {
  align-self: center; width: 64px; height: 64px; border-radius: 50%; background: var(--bubble); color: #fff;
  border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700;
  font-size: 24px; transform: rotate(-8deg); margin: -18px 0; z-index: 2; position: relative;
}
.match { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.match .divider { display: flex; align-items: center; gap: 8px; font-family: var(--display); color: var(--bubble); font-size: 13px; }
.match .divider::before, .match .divider::after { content: ""; flex: 1; height: 2px; background: var(--ink); opacity: .15; }
.result-line { display: flex; gap: 6px; font-size: 13px; align-items: baseline; }
.result-line .w { font-weight: 900; }
.result-line .l { opacity: .5; font-weight: 600; }

/* Profile */
.profile-head { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--paper); border-radius: 28px; }
.profile-head h2 { font-size: 30px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 10px 4px; text-align: center; border-radius: 14px; box-shadow: 2px 2px 0 var(--ink); background: var(--paper); }
.stat .em { font-size: 22px; }
.stat b { display: block; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stat small { font-size: 11px; }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.badge { padding: 12px 4px; text-align: center; border-radius: 16px; background: var(--mist); box-shadow: 1px 1px 0 var(--ink); }
.badge .em { font-size: 32px; filter: grayscale(1); opacity: .35; }
.badge.on { background: var(--sun); box-shadow: 3px 3px 0 var(--ink); }
.badge.on .em { filter: none; opacity: 1; }
.badge small { display: block; opacity: 1; font-size: 12px; }

/* Forms */
.field {
  width: 100%; font: inherit; font-weight: 700; font-size: 16px; color: var(--ink);
  padding: 13px 14px; border: 2.5px solid var(--ink); border-radius: 16px; background: var(--card);
}
.field::placeholder { color: var(--ink); opacity: .4; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.chip {
  border: 2px solid var(--ink); border-radius: 999px; background: var(--card); padding: 9px 8px;
  font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip[aria-pressed="true"] { background: var(--c, var(--tang)); }
.chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.check { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; border-radius: 18px; box-shadow: 3px 3px 0 var(--ink); }
.check .box { width: 34px; height: 34px; flex: none; border: 2.5px solid var(--ink); border-radius: 10px; display: grid; place-items: center; background: var(--card); font-size: 18px; }
.check[aria-checked="true"] .box { background: var(--mint); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--card); font-size: 22px; padding: 0; }
.emoji-grid button[aria-pressed="true"] { background: var(--bubble); border-width: 3px; }

.stat-boxes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.big-record {
  width: 180px; height: 180px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun);
  box-shadow: 0 7px 0 var(--ink); font-size: 76px; display: grid; place-items: center; margin: 6px auto 0;
  transition: transform .08s, box-shadow .08s;
}
.big-record:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }

/* Logo */
.logo { width: 150px; height: 150px; border-radius: 50%; background: var(--sun); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); display: grid; place-items: center; font-size: 84px; margin: 0 auto; animation: wobble 2.4s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 56px; text-align: center; }

/* Tabs */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 3px solid var(--ink);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
#tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; height: 64px; }
#tabs button.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: var(--ink); opacity: .45; padding: 6px 0; }
#tabs button.tab .em { font-size: 21px; line-height: 26px; filter: grayscale(1); }
#tabs button.tab[aria-current="page"] { opacity: 1; color: #d62f6f; }
#tabs button.tab[aria-current="page"] .em { filter: none; }
#tabs .rec { justify-self: center; width: 70px; height: 70px; border-radius: 50%; background: var(--bubble); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 34px; transform: translateY(-16px); display: grid; place-items: center; }
#tabs[hidden] { display: none !important; }

/* Overlays */
#overlay { position: fixed; inset: 0; z-index: 40; background: rgba(34, 26, 56, .45); display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); }
#overlay .sheet { width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto; padding: 22px; background: var(--paper); border-radius: 28px; box-shadow: 6px 6px 0 var(--ink); border: 3px solid var(--ink); display: flex; flex-direction: column; gap: 12px; }
#overlay .sheet h2 { font-size: 26px; text-align: center; }
.sheet-list button { width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card); font-weight: 800; }
#toast {
  position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 3px 3px 0 var(--ink);
  padding: 10px 16px; font-weight: 800; max-width: min(420px, calc(100% - 32px)); text-align: center;
}
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
.confetti span { position: absolute; top: -50px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(var(--r)); } }
.spinner { width: 34px; height: 34px; border: 4px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--paper); }
.empty .em { font-size: 60px; }
.empty h3 { font-size: 22px; }

@media (prefers-reduced-motion: reduce) {
  .logo, .play.loading, .spinner { animation: none; }
  .confetti { display: none; }
  .swipe-card, .duel-card { transition: none; }
}
</style>

<div id="app" aria-live="polite"></div>
<nav id="tabs" hidden aria-label="Hauptnavigation">
  <div class="inner">
    <button class="tab" data-tab="discover"><span class="em">🔥</span>Entdecken</button>
    <button class="tab" data-tab="duels"><span class="em">⚡</span>Duelle</button>
    <button class="rec" data-tab="record" aria-label="Pups aufnehmen">💨</button>
    <button class="tab" data-tab="ranking"><span class="em">🏆</span>Ranking</button>
    <button class="tab" data-tab="profile"><span class="em">👤</span>Profil</button>
  </div>
</nav>
<div id="overlay" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="file-input" accept="audio/*,video/*" hidden>

<script>
"use strict";
/* ============================== Konstanten ============================== */
const DAY = 864e5;
const SR = 8000;              // Speicher-Abtastrate: reicht für tiefe Töne locker
const WIN = 400;              // 50-ms-Analysefenster
const MAX_SEC = 15;

const FOODS = [["Bohnen","🫘"],["Zwiebeln","🧅"],["Kohl","🥬"],["Brokkoli","🥦"],["Döner","🥙"],["Pizza","🍕"],["Burger","🍔"],["Eier","🥚"],["Chili","🌶️"],["Knoblauch","🧄"],["Milch","🥛"],["Bier","🍺"],["Burrito","🌯"],["Curry","🍛"],["Linsen","🥣"],["Pommes","🍟"]];
const foodEmoji = n => (FOODS.find(f => f[0] === n) || [0, "🍽️"])[1];
const CATS = {
  knaller:    { label: "Knaller",    emoji: "💥", color: "var(--tang)",   tint: "#ffe6cf", verdict: "Kurz, laut, effektiv. Respekt!" },
  trompete:   { label: "Trompete",   emoji: "🎺", color: "var(--sun)",    tint: "#fff3c2", verdict: "Klar im Ton, stolz in der Haltung." },
  marathon:   { label: "Marathon",   emoji: "⏱️", color: "var(--sky)",    tint: "#d8efff", verdict: "Das nennt man Ausdauer. Olympia-reif!" },
  ninja:      { label: "Ninja",      emoji: "🥷", color: "var(--grape)",  tint: "#e8e0ff", verdict: "Leise, aber tödlich. Niemand wird es je erfahren." },
  knatterer:  { label: "Knatterer",  emoji: "🏍️", color: "var(--mint)",   tint: "#dcf7e1", verdict: "Wie ein Moped am Sonntagmorgen." },
  quietscher: { label: "Quietscher", emoji: "🐭", color: "var(--bubble)", tint: "#ffe0ec", verdict: "Hoch, piepsig, irgendwie süß." },
};
const cat = c => CATS[c] || CATS.trompete;
const autoCat = (d, p) => d >= 5 ? "marathon" : p < 25 ? "ninja" : (d < 1.2 && p >= 70) ? "knaller" : p >= 60 ? "trompete" : "knatterer";
const BADGES = [
  ["erster_pups", "Erster Pups", "🐣", "Deinen ersten Pups hochgeladen."],
  ["donnergott", "Donnergott", "⛈️", "Wumms-Score von 90 oder mehr."],
  ["marathon", "Marathon", "⏱️", "Ein Pups, länger als 5 Sekunden."],
  ["ninja", "Ninja", "🥷", "Wumms-Score unter 20. Psst!"],
  ["bohnenkoenig", "Bohnenkönig", "🫘", "10 Fürze nach Bohnen."],
  ["streak7", "Dauerbrenner", "🔥", "7 Tage am Stück hochgeladen."],
  ["duellmeister", "Duellmeister", "⚔️", "10 Duelle gewonnen."],
  ["turniersieger", "Turniersieger", "🏆", "Ein Wochenturnier gewonnen."],
  ["pups_des_tages", "Pups des Tages", "👑", "Eine Daily Challenge gewonnen."],

function derive() {

let writeChain = Promise.resolve();
function enqueue(fn) {
  const p = writeChain.then(fn);
  writeChain = p.catch(() => {});
  return p.catch(handleWriteError);
}
function handleWriteError(e) {
  const code = e && e.code;
  if (S.mode === "supa" && (code === "42501" || code === "PGRST301" || (e && e.status === 401))) { toast("Bitte melde dich (erneut) an."); S.tab = "login"; render(); return false; }
  if (S.mode === "supa" && code === "23514") { toast("Das ist zu groß zum Speichern. Lösch ein paar alte Fürze."); return false; }
  if (code === "invalid_argument") { S.canWrite = false; toast("Du kannst hier nur zuhören, nicht mitmachen."); render(); }
  else if (code === "quota_exceeded") toast("Der Speicher der Community ist voll. Alte Fürze löschen hilft.");
  else if (code === "resource_exhausted") toast("Etwas zu schnell! Kurz durchatmen und nochmal.");
  else toast("Konnte nicht speichern. Prüf deine Verbindung.");
  return false;
}
function mergeDeep(a, b) {
  const out = { ...(a || {}) };
  for (const [k, v] of Object.entries(b)) out[k] = (v && typeof v === "object" && !Array.isArray(v) && out[k] && typeof out[k] === "object" && !Array.isArray(out[k])) ? mergeDeep(out[k], v) : v;
  return out;
}
/* Supabase (GitHub-Pages-Version): eine Zeile pro Person, Audio in eigener Tabelle */
function supaSaveMe() {
  S.pending++;
  return enqueue(async () => {
    try {
      const { error } = await S.supa.from("pupsy_users").upsert({ id: S.uid, doc: S.users[S.uid], updated_at: new Date().toISOString() });
      if (error) throw error;
      S.meExists = true;
      return true;
    } finally { S.pending--; }
  });
}
function updateMe(patch) {
  S.users = { ...S.users, [S.uid]: mergeDeep(S.users[S.uid], patch) };
  derive();
  if (S.mode === "supa") return supaSaveMe();
  if (S.mode !== "live") return Promise.resolve(true);
  const ref = S.db.doc("users/" + S.uid);
  return enqueue(async () => {
    if (S.meExists) await ref.update(patch);
    else { await ref.set(S.users[S.uid]); S.meExists = true; }
    return true;
  });
}
function setMe(doc) {
  S.users = { ...S.users, [S.uid]: doc };
  derive();
  if (S.mode === "supa") return supaSaveMe();
  if (S.mode !== "live") return Promise.resolve(true);
  return enqueue(async () => { await S.db.doc("users/" + S.uid).set(doc); S.meExists = true; return true; });
}
async function putAudio(fid, bytes) {
  const body = { d: toB64(bytes), n: bytes.length };
  if (S.mode === "supa") return enqueue(async () => {
    const { error } = await S.supa.from("pupsy_audio").upsert({ id: fid, owner: S.uid, d: body.d });
    if (error) throw error;
    return true;
  });
  if (S.mode !== "live") { S.demoAudio.set(fid, body); return true; }
  return enqueue(async () => { await S.db.doc("users/" + S.uid + "/audio/" + fid).set(body); return true; });
}
async function loadAudio(f) {
  if (f.ex) return synth(f.seed, f.dur, f.loud);
  let body = S.demoAudio.get(f.id);
  if (!body && S.mode === "supa") {
    const { data, error } = await S.supa.from("pupsy_audio").select("d").eq("id", f.id).maybeSingle();
    if (error) throw error;
    body = data;
  }
  if (!body && S.mode === "live") {
    const snap = await S.db.doc("users/" + f.owner + "/audio/" + f.id).get();
    body = snap.exists ? snap.data() : null;
  }
  if (!body || !body.d) throw new Error("missing");
  return decodeMulaw(fromB64(body.d));
}
function deleteAudio(owner, fid) {
  if (S.mode === "supa") return enqueue(async () => { const { error } = await S.supa.from("pupsy_audio").delete().eq("id", fid); if (error) throw error; });
  if (S.mode !== "live") { S.demoAudio.delete(fid); return Promise.resolve(); }
  return enqueue(() => S.db.doc("users/" + owner + "/audio/" + fid).delete());
}
async function adminRemove(f) {
  const u = S.users[f.owner]; if (!u) return;
  const farts = { ...(u.farts || {}) }; delete farts[f.id];
  const doc = { ...u, farts };
  S.users = { ...S.users, [f.owner]: doc }; derive();
  if (S.mode === "live") await enqueue(() => S.db.doc("users/" + f.owner).set(doc));
  await deleteAudio(f.owner, f.id);
  toast("Pups entfernt.");
}

async function initSupabase(cfg) {
  S.mode = "supa";
  S.supa = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await S.supa.auth.getSession();
  S.uid = (data.session && data.session.user.id) || null;
  S.canWrite = !!S.uid;
  S.supa.auth.onAuthStateChange((_ev, session) => {
    const id = (session && session.user && session.user.id) || null;
    if (id === S.uid) return;
    S.uid = id; S.canWrite = !!id; S.meExists = !!S.users[id];
    S.local = { swipes: {}, duels: {}, tvotes: {} }; S.deckReady = false;
    if (id && S.tab === "login") S.tab = "discover";
    derive(); render();
  });
  await supaLoad();
  S.loaded = true; derive(); render();
  S.supa.channel("pupsy-users")
    .on("postgres_changes", { event: "*", schema: "public", table: "pupsy_users" }, () => {
      clearTimeout(supaLoad.t);
      supaLoad.t = setTimeout(async () => { await supaLoad(); derive(); softRender(); }, 400);
    })
    .subscribe();
}
async function supaLoad() {
  const { data, error } = await S.supa.from("pupsy_users").select("id, doc").limit(2000);
  if (error) { S.stale = true; return; }
  const users = {};
  for (const r of data) users[r.id] = r.doc || {};
  if (S.pending > 0 && S.users[S.uid]) users[S.uid] = S.users[S.uid];  // eigene, noch laufende Änderung behalten
  S.users = users; S.stale = false;
  S.meExists = !!users[S.uid] || S.meExists;
}

async function initStore() {
  const cfg = window.PUPSY_CONFIG || {};
  if (cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase) {
    try { return await initSupabase(cfg); }
    catch (e) { toast("Supabase ist nicht erreichbar. Vorschau-Modus aktiv."); S.mode = "loading"; }
  }
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  } catch (e) { db = null; }
  const uid = user ? await user.id().catch(() => null) : null;
  if (!db || !uid) return startDemo();
  S.mode = "live"; S.db = db; S.uid = uid;
  const [can, owner] = await Promise.all([user.can("data.write").catch(() => null), user.isOwner().catch(() => false)]);
  S.canWrite = can !== false; S.isOwner = !!owner;
  let timer = setTimeout(() => { S.stale = true; if (!S.loaded) { S.loaded = true; derive(); } render(); }, 10000);
  db.collection("users").limit(1000).onSnapshot(snap => {
    const users = {};
    for (const d of snap.docs) users[d.id] = d.data();
    S.users = users;
    S.meExists = !!users[S.uid] || S.meExists;
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; }
    const first = !S.loaded; S.loaded = true;
    derive();
    if (first) S.tab = "discover";
    softRender();
  }, err => {
    clearTimeout(timer); S.loaded = true; S.stale = true; derive();
    toast("Die Community ist gerade nicht erreichbar.");
    render();
  });
}
function startDemo() {
  S.mode = "demo"; S.uid = "you"; S.canWrite = true; S.loaded = true; S.users = {};
  derive(); render();
}

/* ============================== Wiedergabe ============================== */
const P = { ctx: null, src: null, id: null, start: 0, dur: 0, raf: 0, cache: new Map() };
function ensureCtx() {
  if (!P.ctx) { const AC = window.AudioContext || window.webkitAudioContext; P.ctx = new AC(); }
  if (P.ctx.state === "suspended") P.ctx.resume();
  return P.ctx;
}
function stopAudio() {
  if (P.src) { try { P.src.onended = null; P.src.stop(); } catch (e) {} }
  P.src = null; P.id = null; cancelAnimationFrame(P.raf);
  syncPlayUI();
}
async function bufferFor(key, loader) {
  if (P.cache.has(key)) return P.cache.get(key);
  const samples = await loader();
  const buf = P.ctx.createBuffer(1, Math.max(1, samples.length), SR);
  buf.copyToChannel(samples, 0);
  if (P.cache.size > 40) P.cache.delete(P.cache.keys().next().value);
  P.cache.set(key, buf);
  return buf;
}
async function playKey(key, loader) {
  ensureCtx();
  if (P.id === key) { stopAudio(); return; }
  stopAudio();
  P.id = key; syncPlayUI(true);
  let buf;
  try { buf = await bufferFor(key, loader); }
  catch (e) { if (P.id === key) { stopAudio(); toast("Dieser Pups lässt sich gerade nicht abspielen."); } return; }
  if (P.id !== key) return;
  const src = P.ctx.createBufferSource();
  src.buffer = buf; src.connect(P.ctx.destination);
  src.onended = () => { if (P.src === src) stopAudio(); };
  P.src = src; P.start = P.ctx.currentTime; P.dur = buf.duration;
  src.start();
  syncPlayUI();
  const tick = () => {
    if (P.src !== src) return;
    const p = clamp((P.ctx.currentTime - P.start) / P.dur) * 100;
    for (const w of $$('[data-wave="' + key + '"]')) w.style.setProperty("--p", p + "%");
    P.raf = requestAnimationFrame(tick);
  };
  tick();
}
const playFart = f => playKey(f.id, () => loadAudio(f));
function syncPlayUI(loading) {
  for (const b of $$("[data-play]")) {
    const on = b.dataset.play === P.id;
    b.classList.toggle("playing", on);
    b.classList.toggle("loading", on && !!loading);
    b.setAttribute("aria-label", on ? "Stopp" : "Abspielen");
  }
  for (const w of $$("[data-wave]")) if (w.dataset.wave !== P.id) w.style.setProperty("--p", "0%");
}

const playBtn = (key, size = 52) => `<button class="play" data-play="${esc(key)}" style="--s:${size}px" aria-label="Abspielen">${ICON_PLAY}</button>`;
function waveHTML(key, wave, color, h = 70) {

}
const empty = (em, title, text, extra = "") => `<div class="card empty"><div class="em" aria-hidden="true">${em}</div><h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p>${extra}</div>`;
const moreBtn = f => (f.ex || f.owner === S.uid) && !S.isOwner ? "" : `<button class="icon-btn" data-menu="${esc(f.id)}" aria-label="Mehr Optionen">⋯</button>`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2800);
}
function openSheet(html) { const o = $("#overlay"); o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; o.hidden = false; }
function closeSheet() { $("#overlay").hidden = true; $("#overlay").innerHTML = ""; $$(".confetti").forEach(c => c.remove()); }
function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("span");
    s.textContent = pick(["💨", "🎉", "⭐️", "💥", "🫘", "✨", "🏆"]);

    s.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    c.appendChild(s);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
}

/* ============================== Ansichten ============================== */
function render() {
  const app = $("#app"), tabs = $("#tabs");
  if (S.mode === "loading" || !S.loaded) {
    tabs.hidden = true; app.classList.add("no-tabs");
    app.innerHTML = `<div style="margin-top:12vh" class="stack center"><div class="logo" aria-hidden="true">💨</div><div class="wordmark">Pupsy</div><p class="muted" style="margin:0">Die Community wird geladen …</p><div class="spinner" aria-label="Lädt"></div></div>`;
    return;
  }
  if (S.mode === "supa" && !S.uid && (S.tab === "login" || S.tab === "record")) { tabs.hidden = true; app.classList.add("no-tabs"); renderLogin(); return; }
  const needsProfile = S.canWrite && (!me() || !me().name);
  if (needsProfile || S.editingProfile) { tabs.hidden = true; app.classList.add("no-tabs"); renderOnboarding(); return; }
  if (S.tab === "login") S.tab = "discover";
  tabs.hidden = S.tab === "record"; app.classList.toggle("no-tabs", S.tab === "record");
  for (const b of $$("#tabs .tab")) b.toggleAttribute("aria-current", false), b.dataset.tab === S.tab && b.setAttribute("aria-current", "page");
  ({ discover: renderDiscover, duels: renderDuels, record: renderRecord, ranking: renderRanking, profile: renderProfile })[S.tab]();
  syncPlayUI();
}
function softRender() {
  if (S.dragging || S.swiping) return;
  if (S.tab === "record" && S.rec.stage !== "pick") return;  // Formular nicht zerstören
  if (S.editingProfile) return;
  render();
}

function banners() {
  let h = "";
  if (S.mode === "demo") h += `<div class="notice card">👀 <b>Vorschau.</b> Hier läuft alles nur in deinem Browser. Deine Fürze sieht noch niemand sonst.</div>`;
  else if (S.mode === "supa" && !S.uid) h += `<div class="notice card row"><span class="grow">🎧 Du hörst als Gast zu. Melde dich an, um abzustimmen und hochzuladen.</span><button class="btn sm" data-tab="login">Anmelden</button></div>`;
  else if (!S.canWrite) h += `<div class="notice card">🎧 Du kannst zuhören und stöbern. Zum Mitmachen brauchst du mindestens Mitwirkenden-Rechte für diese Seite.</div>`;
  if (S.stale) h += `<div class="notice card">📡 Die Community ist gerade nicht erreichbar. Was du siehst, ist vielleicht nicht aktuell.</div>`;
  if ((S.mode === "live" || S.mode === "supa") && D.useEx && D.real.length < 5) h += `<div class="notice card">🌱 Die Community ist noch jung. Bis 5 echte Fürze da sind, mischen wir <b>Beispiel-Fürze</b> unter. Stimmen dafür zählen nur bei dir.</div>`;
  return h;
}

function refreshOnboardingButton() {
  const valid = /^[A-Za-z0-9_äöüÄÖÜß]{3,20}$/.test(OB.name);
  const btn = $("#ob-go"); if (btn) btn.disabled = !(valid && (OB.ok || S.editingProfile));

async function submitOnboarding() {
  const taken = Object.entries(S.users).some(([uid, u]) => uid !== S.uid && u && u.name && u.name.toLowerCase() === OB.name.toLowerCase())
    || EX_USERS.some(u => u[0].toLowerCase() === OB.name.toLowerCase());
  if (taken) { toast(`„${OB.name}“ ist schon vergeben 😅`); return; }
  const first = !me() || !me().name;
  await updateMe({ name: OB.name, emoji: OB.emoji, ...(first ? { joined: Date.now() } : {}) });
  S.editingProfile = false; OB = null;
  if (first) toast("Willkommen bei Pupsy! 💨");

/* ---------- Entdecken ---------- */
function buildDeck() {
  const done = mySwipes();
  const list = D.visible.filter(f => f.owner !== S.uid && !done[f.id]);
  const now = Date.now();
  S.deck = [...shuffle(list.filter(f => now - f.t < 2 * DAY)), ...shuffle(list.filter(f => now - f.t >= 2 * DAY))].map(f => f.id);
  S.deckReady = true;
}
function renderDiscover() {
  if (!S.deckReady || !S.deck.length) buildDeck();
  S.deck = S.deck.filter(id => D.byId[id] && !D.byId[id].hidden && D.visible.includes(D.byId[id]));
  $("#app").innerHTML = `
    <div class="title-row"><div><h1>Entdecken</h1><div class="subtitle">Hör rein und swipe!</div></div>
      <button class="icon-btn" id="autoplay" aria-pressed="${S.autoplay}" aria-label="Automatisch abspielen">${S.autoplay ? "🔊" : "🔇"}</button></div>
    ${banners()}
    ${challengeBanner(true)}
    <div class="deck" id="deck"></div>
    <div class="actions" id="actions"></div>`;
  renderDeck();
}
function cardHTML(f, idx) {

      <div class="grow"><div class="ellipsis" style="font-weight:900">${esc(nameOf(f.owner))}</div><small>${ago(f.t)}</small></div>${exPill(f)}${moreBtn(f)}</div>
    <h2>${esc(f.title || "Ohne Titel")}</h2>

    <div class="foot"><span>❤️ ${f.likes}</span><span>⭐️ ${f.supers}</span><span>Elo ${Math.round(f.elo)}</span></div>
    ${idx === 0 ? `<span class="stamp like">PUPS! 💨</span><span class="stamp nope">NÖ 🙅</span><span class="stamp super">SUPER ⭐️</span>` : ""}
  </article>`;
}
function renderDeck() {
  const deck = $("#deck"), actions = $("#actions"); if (!deck) return;
  const cards = S.deck.slice(0, 3).map(id => D.byId[id]).filter(Boolean);
  if (!cards.length) {
    deck.style.height = "auto";
    deck.innerHTML = empty("🎧", "Alles gehört!", D.all.length ? "Du hast jeden Pups bewertet. Nimm selbst einen auf oder schau später wieder rein." : "Noch keine Fürze da. Sei der Erste und nimm einen auf!",
      `<button class="btn" data-tab="record" style="margin-top:6px">💨 Pups aufnehmen</button>`);
    actions.innerHTML = "";
    return;
  }
  deck.style.height = "";
  deck.innerHTML = cards.map((f, i) => cardHTML(f, i)).reverse().join("");
  const top = cards[0];
  const canVote = top.ex || S.canWrite;
  actions.innerHTML = canVote
    ? `<button class="round" style="--c:var(--bubble)" data-swipe="nope" aria-label="Nö">✕</button>
       <button class="round" style="--c:var(--sky);--s:52px" data-swipe="super" aria-label="Super-Pups">⭐️</button>

    : `<button class="btn white" data-swipe="skip">Nächster ➜</button>`;

}
function setCardPos(card, dx, dy) {
  card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
  const s = n => card.querySelector(".stamp." + n);
  if (s("like")) { s("like").style.opacity = clamp(dx / 100); s("nope").style.opacity = clamp(-dx / 100); s("super").style.opacity = clamp(-dy / 130); }
}
function attachDrag(card, canVote) {
  if (!card) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false;
  card.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    active = true; S.dragging = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.setPointerCapture(e.pointerId); card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => { if (!active) return; dx = e.clientX - sx; dy = e.clientY - sy; setCardPos(card, dx, dy); });
  const end = () => {
    if (!active) return; active = false; S.dragging = false;
    card.style.transition = "";
    const kind = !canVote ? (Math.abs(dx) > 100 ? "skip" : null) : (dy < -120 && Math.abs(dx) < 110) ? "super" : dx > 100 ? "like" : dx < -100 ? "nope" : null;
    if (kind) doSwipe(kind, card, dx, dy); else setCardPos(card, 0, 0), (card.style.transform = "");
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
function superCountToday() {
  const t = today();
  return Object.values(mySwipes()).filter(v => v && v.k === "s" && dayKey(v.t) === t).length;
}
async function doSwipe(kind, card, dx = 0, dy = 0) {
  if (S.swiping) return;
  const fid = S.deck[0], f = D.byId[fid]; if (!f) return;
  card = card || $(`[data-card="${CSS.escape(fid)}"]`);
  if (kind === "super" && !f.ex && superCountToday() >= 5) {
    toast("Du hast heute schon 5 Super-Pupse vergeben ⭐️");
    if (card) { card.style.transform = ""; setCardPos(card, 0, 0); card.style.transform = ""; }
    return;
  }
  S.swiping = true; stopAudio();
  if (card) {
    card.style.transition = "transform .25s ease-in";
    const tx = kind === "like" ? 700 : kind === "nope" ? -700 : kind === "skip" ? (dx >= 0 ? 700 : -700) : dx;
    const ty = kind === "super" ? -1000 : dy;
    card.style.transform = `translate(${tx}px, ${ty}px) rotate(${tx / 18}deg)`;
  }
  await sleep(260);
  S.deck.shift(); S.swiping = false;
  if (kind !== "skip") {
    const v = { k: kind === "like" ? "l" : kind === "nope" ? "n" : "s", t: Date.now() };
    if (f.ex) { S.local.swipes[fid] = v; derive(); }
    else updateMe({ swipes: { [fid]: v } });
  }
  if (!S.deck.length) buildDeck();
  renderDeck();
  autoplayTop();
}
function autoplayTop() {
  if (!S.autoplay || !P.ctx || P.ctx.state !== "running") return;

}

function pickDuel() {
  const done = myDuels();
  const pool = shuffle(D.visible.filter(f => f.owner !== S.uid));
  for (const a of pool) {
    const cand = pool.filter(b => b.id !== a.id && !done[pairKey(a.id, b.id)]).sort((x, y) => Math.abs(x.elo - a.elo) - Math.abs(y.elo - a.elo));
    if (cand.length) return [a.id, cand[0].id];
  }
  return null;
}

async function voteDuel(wid) {

function voteTournament(key, side) {

async function submitLogin() {
  const L = S.login; if (L.busy) return;
  L.busy = true;
  try {
    if (!L.sent) {
      L.email = ($("#login-email").value || "").trim();
      renderLogin();
      const { error } = await S.supa.auth.signInWithOtp({ email: L.email, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      L.sent = true;
    } else {
      const token = ($("#login-code").value || "").trim();
      renderLogin();
      const { error } = await S.supa.auth.verifyOtp({ email: L.email, token, type: "email" });
      if (error) throw error;
      S.login = { email: "", sent: false, busy: false };
      S.tab = "discover";
      return;
    }
  } catch (e) {
    toast(e && e.status === 429 ? "Zu viele Versuche. Warte kurz und probier es nochmal." : L.sent ? "Der Code stimmt nicht oder ist abgelaufen." : "Die Mail konnte nicht verschickt werden. Prüf die Adresse.");
  } finally {
    L.busy = false;
    if (S.tab === "login" || (!S.uid && S.tab === "record")) render();
  }
}

  stopAudio();
  for (const fid of Object.keys(u.farts || {})) await deleteAudio(S.uid, fid);
  if (S.mode === "supa") await enqueue(async () => { const { error } = await S.supa.from("pupsy_users").delete().eq("id", S.uid); if (error) throw error; });
  if (S.mode === "live") await enqueue(() => S.db.doc("users/" + S.uid).delete());
  const users = { ...S.users }; delete users[S.uid]; S.users = users; S.meExists = false;
  derive(); toast("Alles gelöscht. Tschüss! 👋"); render();
}

/* ---------- Aufnehmen ---------- */
function renderRecord() {
  const R = S.rec, app = $("#app");
  const head = `<div class="title-row"><button class="icon-btn" id="rec-close" aria-label="Schließen">✕</button><div class="center"><h1 style="font-size:24px">Neuer Pups</h1></div><span style="width:44px"></span></div>`;
  if (!S.canWrite) { app.innerHTML = head + empty("🔒", "Nur zum Zuhören", "Zum Hochladen brauchst du mindestens Mitwirkenden-Rechte für diese Seite."); return; }
  if (R.stage === "pick") {
    app.innerHTML = `${head}${challengeBanner(false)}
      <div class="card stack center" style="padding:22px;align-items:center">
        <button class="big-record" id="rec-file" aria-label="Aufnehmen oder Datei wählen">💨</button>
        <h2 style="font-size:24px;margin-top:6px">Aufnehmen oder Datei wählen</h2>
        <p class="muted" style="margin:0;max-width:34ch">Auf dem Handy: <b>Video aufnehmen</b> (Kamera ruhig abdecken 😏) oder eine Sprachmemo wählen. Wir nutzen nur den Ton, maximal 15 Sekunden.</p>
      </div>
      <button class="btn white block" id="rec-gen">🎲 Zufalls-Pups erzeugen</button>
      <p class="muted center" style="font-size:12px;margin:0">Generierte Fürze werden als „🎲 generiert“ markiert.</p>`;
    return;
  }
  if (R.stage === "busy") { app.innerHTML = head + `<div class="card empty"><div class="spinner"></div><h3>${esc(R.busyText || "Analysiere …")}</h3></div>`; return; }
  const c = cat(R.cat), ch = challengeFor(today());
  app.innerHTML = `${head}
    <div class="card stack" style="padding:16px;gap:14px">
      <h2 style="font-size:20px">Deine Analyse 🔬</h2>
      <div class="player">${playBtn(R.key, 52)}${waveHTML(R.key, R.wave, c.color, 70)}</div>
      <div class="stat-boxes">
        <div class="stat card"><div class="em">⏱️</div><b>${fmtSec(R.dur)}</b><small>Dauer</small></div>
        <div class="stat card"><div class="em">💥</div><b>${R.peak}</b><small>Wumms</small></div>
        <div class="stat card"><div class="em">${c.emoji}</div><b class="ellipsis">${c.label}</b><small>Typ</small></div>
      </div>
      <div class="note">${esc(c.verdict)}</div>
      <div><button class="btn white sm" id="rec-again">🔁 Nochmal</button></div>
    </div>
    <label class="label" for="rec-title">Titel</label>
    <input id="rec-title" class="field" maxlength="60" placeholder="z. B. Der Weckruf" value="${esc(R.title)}">
    <div class="label">Kategorie</div>
    <div class="chip-scroll" role="group" aria-label="Kategorie">${Object.entries(CATS).map(([k, v]) => `<button class="chip" style="--c:${v.color};flex:none;padding:9px 14px" data-cat="${k}" aria-pressed="${R.cat === k}">${v.emoji} ${v.label}</button>`).join("")}</div>
    <div class="label">Was hast du davor gegessen? 🍽️</div>
    <div class="chips" role="group" aria-label="Essen">${FOODS.map(([n, e]) => `<button class="chip" data-food="${esc(n)}" aria-pressed="${R.foods.includes(n)}">${e} ${esc(n)}</button>`).join("")}</div>
    <input id="rec-note" class="field" maxlength="120" placeholder="Sonst noch was? (z. B. 3 Teller Chili)" value="${esc(R.note)}">
    <button class="check card" id="rec-ch" role="checkbox" aria-checked="${R.ch}"><span style="flex:1"><b style="font-family:var(--display);font-size:16px;font-weight:600">Bei „${esc(ch.title)}“ mitmachen ${ch.emoji}</b><br><small>${ch.food ? `Nur mit ${esc(ch.food)} im Bauch! ` : ""}+20 XP Bonus</small></span><span class="box">${R.ch ? "✓" : ""}</span></button>
    <button class="btn mint block" id="rec-upload">Hochladen 🚀</button>`;
}
function startDraft(samples, extra = {}) {
  const a = extra.analysis || analyze(samples);
  S.rec = { stage: "review", key: "draft-" + rid(6), samples: a.samples, dur: a.dur, peak: a.peak, wave: a.wave, cat: a.cat, title: pick(TITLE_IDEAS), foods: [], note: "", ch: false, gen: !!extra.gen };
  render();
}
async function handleFile(file) {
  if (!file) return;
  S.rec = { stage: "busy", busyText: "Analysiere deinen Pups …" }; render();
  try {
    if (file.size > 60 * 1024 * 1024) throw new Error("too_big");
    const buf = await file.arrayBuffer();
    const ctx = ensureCtx();
    const audio = await new Promise((res, rej) => { const p = ctx.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); });
    const len = Math.max(1, Math.ceil(Math.min(audio.duration, 120) * SR));
    const off = new OfflineAudioContext(1, len, SR);
    const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
    const rendered = await off.startRendering();
    const samples = rendered.getChannelData(0);
    const a = analyze(samples);
    if (a.samples.length < SR * .1) throw new Error("short");
    startDraft(null, { analysis: a });
  } catch (e) {
    S.rec = { stage: "pick" }; render();
    toast(e.message === "too_big" ? "Die Datei ist zu groß. Nimm einen kürzeren Clip." : e.message === "short" ? "Da war nix 🤔 Versuch's nochmal." : "Diese Datei kann ich nicht lesen. Probier ein Video oder eine Sprachmemo (m4a, mp3, wav).");
  }
}
function generateFart() {
  const dur = 1 + Math.random() * 3.5, peak = Math.round(30 + Math.random() * 65), loud = .15 + .85 * peak / 100;
  const samples = synth(Math.floor(Math.random() * 1e9), dur, loud);
  startDraft(null, { gen: true, analysis: { samples, dur, peak, wave: waveFromSamples(samples, loud), cat: autoCat(dur, peak) } });
}
async function uploadDraft() {
  const R = S.rec; if (R.stage !== "review") return;
  R.title = ($("#rec-title").value || "").trim().slice(0, 60) || "Ohne Titel";
  R.note = ($("#rec-note").value || "").trim().slice(0, 120);
  const before = statsFor(S.uid);
  S.rec = { ...R, stage: "busy", busyText: "Pups wird hochgeladen …" }; render();
  const fid = rid(10);
  const bytes = encodeMulaw(R.samples.length > MAX_SEC * SR ? R.samples.subarray(0, MAX_SEC * SR) : R.samples);
  const okA = await putAudio(fid, bytes);
  if (okA === false) { S.rec = R; render(); return; }
  const meta = { title: R.title, cat: R.cat, dur: Math.round(R.dur * 100) / 100, peak: R.peak, wave: encWave(R.wave), foods: R.foods, note: R.note || null, t: Date.now(), ch: R.ch ? today() : null };
  if (R.gen) meta.gen = true;
  const okM = await updateMe({ farts: { [fid]: meta } });
  if (okM === false) { S.rec = R; render(); return; }
  if (S.mode === "demo") S.demoAudio.set(fid, { d: toB64(bytes), n: bytes.length });
  const after = statsFor(S.uid);
  const newBadges = [...after.badges].filter(b => !before.badges.has(b));
  S.rec = { stage: "pick" }; S.tab = "discover"; stopAudio(); render();
  celebrate("Hochgeladen! 💨", `+${after.xp - before.xp} XP. Jetzt kann die Community abstimmen.`, newBadges);
}
function celebrate(title, sub, badges) {
  openSheet(`<div class="center" style="font-size:64px">${badges.length ? "🏅" : "🎉"}</div><h2>${esc(title)}</h2><p class="center muted" style="margin:0">${esc(sub)}</p>
    ${badges.length ? `<div class="eyebrow center">Neue Abzeichen</div>` + badges.map(code => { const b = BADGES.find(x => x[0] === code); return `<div class="card row" style="padding:10px;background:var(--sun);box-shadow:3px 3px 0 var(--ink)"><span style="font-size:32px">${b[2]}</span><div><b>${esc(b[1])}</b><br><small>${esc(b[3])}</small></div></div>`; }).join("") : ""}
    <button class="btn pink block" data-close>Yeah! 💨</button>`);
  confetti();
}

/* ---------- Menü: Melden, Blockieren, Entfernen ---------- */
function openMenu(fid) {
  const f = D.byId[fid]; if (!f) return;
  const own = f.owner === S.uid;
  openSheet(`<h2>${esc(f.title)}</h2><div class="stack sheet-list">
    ${!own && !f.ex && S.canWrite ? `<button data-menu-act="report">🚩 Melden</button><button data-menu-act="block">✋ ${esc(nameOf(f.owner))} blockieren</button>` : ""}
    ${S.isOwner && !f.ex ? `<button data-menu-act="remove">🗑️ Entfernen (Admin)</button>` : ""}
    <button data-close>Abbrechen</button></div>`);
  $("#overlay").dataset.fid = fid;
}
function menuAction(act) {
  const fid = $("#overlay").dataset.fid, f = D.byId[fid]; if (!f) return closeSheet();
  if (act === "report") {
    openSheet(`<h2>Warum meldest du diesen Pups?</h2><div class="stack sheet-list">${REPORT_REASONS.map(r => `<button data-report="${esc(r)}">${esc(r)}</button>`).join("")}<button data-close>Abbrechen</button></div>`);
    $("#overlay").dataset.fid = fid;
  } else if (act === "block") {
    openSheet(`<h2>${esc(nameOf(f.owner))} blockieren?</h2><p class="center muted" style="margin:0">Du siehst dann keine Fürze mehr von dieser Person.</p><button class="btn pink block" data-block="${esc(f.owner)}">Blockieren</button><button class="btn white block" data-close>Abbrechen</button>`);
  } else if (act === "remove") {
    openSheet(`<h2>Pups entfernen?</h2><p class="center muted" style="margin:0">„${esc(f.title)}“ von ${esc(nameOf(f.owner))} wird für alle gelöscht.</p><button class="btn pink block" data-remove="${esc(fid)}">Entfernen</button><button class="btn white block" data-close>Abbrechen</button>`);
  }
}
function afterRemoval() {
  S.deck = S.deck.filter(id => D.visible.includes(D.byId[id]));
  if (S.duel && S.duel.some(id => !D.visible.includes(D.byId[id]))) S.duel = null;
  stopAudio(); render();
}

/* ============================== Ereignisse ============================== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-tab]"); if (!t) {
    if (e.target.id === "overlay") closeSheet();
    return;
  }
  const d = t.dataset;
  if (P.ctx === null && (d.play || d.swipe || d.tab)) ensureCtx();
  if (d.tab) {
    if (d.tab === S.tab && d.tab !== "record") return;
    stopAudio();
    if (d.tab === "record" && S.tab !== "record") S.rec = { stage: "pick" };
    S.tab = d.tab; window.scrollTo(0, 0); render();
    if (S.tab === "discover") setTimeout(autoplayTop, 50);
    return;
  }
  if (d.play) {
    if (S.rec.key && d.play === S.rec.key) { playKey(S.rec.key, () => Promise.resolve(S.rec.samples)); return; }
    const f = D.byId[d.play]; if (f) playFart(f); return;
  }
  if (d.swipe) return doSwipe(d.swipe);
  if (d.menu) return openMenu(d.menu);
  if (d.menuAct) return menuAction(d.menuAct);
  if (d.close !== undefined) return closeSheet();
  if (d.report) {
    const fid = $("#overlay").dataset.fid; closeSheet();
    updateMe({ reports: { [fid]: d.report } }); toast("Danke! Wir schauen uns das an. 🕵️"); afterRemoval(); return;
  }
  if (d.block) { closeSheet(); updateMe({ blocked: { [d.block]: true } }); toast(nameOf(d.block) + " blockiert."); afterRemoval(); return; }
  if (d.remove) { closeSheet(); adminRemove(D.byId[d.remove]).then(afterRemoval); return; }
  if (d.duelmode) { S.duelMode = d.duelmode; stopAudio(); renderDuels(); return; }
  if (d.duelPick) return voteDuel(d.duelPick);
  if (d.tvote) return voteTournament(d.tvote, d.side);
  if (d.board) { S.board = d.board; stopAudio(); renderRanking(); return; }
  if (d.badge) { const b = BADGES.find(x => x[0] === d.badge); openSheet(`<div class="center" style="font-size:56px">${b[2]}</div><h2>${esc(b[1])}</h2><p class="center" style="margin:0">${esc(b[3])}</p><button class="btn block" data-close>OK</button>`); return; }
  if (d.delete) { const f = D.byId[d.delete]; openSheet(`<h2>Pups löschen?</h2><p class="center muted" style="margin:0">„${esc(f ? f.title : "")}“ verschwindet für immer.</p><button class="btn pink block" data-confirm-delete="${esc(d.delete)}">Löschen</button><button class="btn white block" data-close>Abbrechen</button>`); return; }
  if (d.confirmDelete) { closeSheet(); deleteFart(d.confirmDelete); return; }
  if (d.obEmoji) { OB.emoji = d.obEmoji; renderOnboarding(); return; }
  if (d.cat) { S.rec.cat = d.cat; syncDraftInputs(); renderRecord(); return; }
  if (d.food) { syncDraftInputs(); const f = S.rec.foods; S.rec.foods = f.includes(d.food) ? f.filter(x => x !== d.food) : [...f, d.food]; renderRecord(); return; }
  switch (t.id) {
    case "autoplay": S.autoplay = !S.autoplay; try { localStorage.setItem("pupsy-autoplay", S.autoplay ? "1" : "0"); } catch (err) {} if (!S.autoplay) stopAudio(); else autoplayTop(); renderDiscover(); return;
    case "ob-dice": OB.name = pick(NAME_A) + pick(NAME_B) + (1 + Math.floor(Math.random() * 99)); renderOnboarding(); return;
    case "ob-ok": OB.ok = !OB.ok; t.setAttribute("aria-checked", OB.ok); t.querySelector(".box").textContent = OB.ok ? "✓" : ""; refreshOnboardingButton(); return;
    case "ob-go": submitOnboarding(); return;
    case "ob-cancel": S.editingProfile = false; OB = null; render(); return;
    case "edit-profile": S.editingProfile = true; OB = null; render(); return;
    case "delete-all": openSheet(`<h2>Alles löschen?</h2><p class="center muted" style="margin:0">Dein Profil, alle deine Fürze und Stimmen werden endgültig gelöscht.</p><button class="btn pink block" id="confirm-delete-all">Endgültig löschen</button><button class="btn white block" data-close>Abbrechen</button>`); return;
    case "confirm-delete-all": closeSheet(); deleteAll(); return;
    case "rec-close": stopAudio(); S.rec = { stage: "pick" }; S.tab = "discover"; render(); return;
    case "rec-file": $("#file-input").value = ""; $("#file-input").click(); return;
    case "rec-gen": generateFart(); return;
    case "rec-again": stopAudio(); S.rec = { stage: "pick" }; render(); return;
    case "rec-ch": syncDraftInputs(); S.rec.ch = !S.rec.ch; t.setAttribute("aria-checked", S.rec.ch); t.querySelector(".box").textContent = S.rec.ch ? "✓" : ""; return;
    case "rec-upload": uploadDraft(); return;
    case "logout": stopAudio(); S.supa.auth.signOut(); toast("Abgemeldet. Bis bald! 👋"); return;
    case "login-back": S.login = { email: S.login.email, sent: false, busy: false }; renderLogin(); return;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "login-form") { e.preventDefault(); submitLogin(); }
});
function syncDraftInputs() {
  const ti = $("#rec-title"), no = $("#rec-note");
  if (ti) S.rec.title = ti.value; if (no) S.rec.note = no.value;
}
document.addEventListener("input", e => {
  if (e.target.id === "ob-name") { OB.name = e.target.value.trim(); refreshOnboardingButton(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#overlay").hidden) closeSheet();
  if (S.tab === "discover" && $("#overlay").hidden && !e.target.closest("input")) {
    if (e.key === "ArrowRight") doSwipe(S.canWrite || (D.byId[S.deck[0]] || {}).ex ? "like" : "skip");
    if (e.key === "ArrowLeft") doSwipe(S.canWrite || (D.byId[S.deck[0]] || {}).ex ? "nope" : "skip");
    if (e.key === "ArrowUp" && (S.canWrite || (D.byId[S.deck[0]] || {}).ex)) doSwipe("super");
  }
});
$("#file-input").addEventListener("change", e => handleFile(e.target.files && e.target.files[0]));

/* ============================== Start ============================== */
render();
initStore();
</script>
